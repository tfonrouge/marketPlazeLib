query GetProductDetailQuery($id: ID!) {
    product(id: $id) {
        id
        handle
        productType
        publishedAt
        title
        vendor
    }
}

query GetProductsQuery($first: Int!, $after: String) {
    products(first: $first, after: $after) {
        pageInfo {
            hasNextPage
            endCursor
        }
        edges {
            cursor
            node {
                _id: id
                handle
                productType
                publishedAt
                title
                vendor
                totalInventory
#                mediaCount {
#                    count
#                    precision
#                }
                media(first: 10) {
                    edges {
                        node {
                            ... on MediaImage {
                                image {
                                    id
                                    altText
                                    url
                                    width
                                }
                            }
                        }
                    }
                }
            }
        }
    }
}
